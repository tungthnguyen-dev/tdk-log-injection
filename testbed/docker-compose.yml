services:
  app:
    build: ./app
    networks:
      labnet:
        ipv4_address: 172.28.0.3

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../data/raw:/var/log/nginx
    depends_on:
      - app
    networks:
      labnet:
        ipv4_address: 172.28.0.2

  benign:
    build: ./generators
    command: sleep infinity
    depends_on:
      - nginx
    networks:
      labnet:
        ipv4_address: 172.28.0.10

  attacker:
    build: ./generators
    command: sleep infinity
    depends_on:
      - nginx
    networks:
      labnet:
        ipv4_address: 172.28.0.20

networks:
  labnet:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
